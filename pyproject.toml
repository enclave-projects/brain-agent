[project]
name = "brain-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-lg",
    "langchain-core>=1.7.7",
    "langchain-openai>=1.7.4",
    "langchain-sarvam>=0.1.2",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "presidio-analyzer>=2.2.366",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sarvamai>=0.1.43",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
